services:
  web: 
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports: 
      - '5173:5173'
    volumes:
      - /app/node_modules
      - .:/app
  tests:
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - .:/app
    command: ['npm','run', 'test',"--", "--watch"]
